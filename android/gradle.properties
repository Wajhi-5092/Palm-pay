org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Windows fix: Kotlin incremental cache path-root issue (Pub cache on C:, project on D:)
kotlin.incremental=false
# Reduce daemon cache complexity; more reliable for Flutter plugin builds on Windows.
kotlin.compiler.execution.strategy=in-process

# IMPORTANT:
# Do NOT hardcode org.gradle.java.home unless you are sure the JDK is valid.
# Your Android Studio `jbr` appears broken (missing jvm.cfg), so set JAVA_HOME
# to a real JDK 17 installation instead.
