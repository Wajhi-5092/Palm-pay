name: paypalm
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  phosphor_flutter: ^2.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  firebase_core: ^3.11.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.3
  shared_preferences: ^2.5.2
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.1.0
  connectivity_plus: ^6.1.5
  internet_connection_checker: ^3.0.1
  crypto: ^3.0.7
  intl: ^0.20.2
  image_picker: ^1.2.2
  firebase_storage: ^12.4.10
  pdf: ^3.12.0
  path_provider: ^2.1.5
  open_file: ^3.5.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png